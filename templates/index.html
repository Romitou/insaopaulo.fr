<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, minimum-scale=1, user-scalable=0;">
    <title>{{ siteName }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>
    <p style="z-index: 99; position: fixed; bottom: 2.5%; right: 2.5%; font-size: 0.75rem;">© - Hugo Leroi--Facquet</p>
    <div id="mainScreen" class="screen">
        <div data-include="heroBanner" id = 'heroBanner' class = 'page heroBanner active'></div>
    </div>
    <script src="{{ url_for('static', filename='importScript.js') }}"></script>
    <script src="{{ url_for('static', filename='heroBanner.js') }}"></script>
    <script src="{{ url_for('static', filename='darkMode.js') }}"></script>
    <script>
        window.onload = function() {
            importModule();
            setTimeout(() => {
                runColorMode((isDarkMode) => {
                    if (isDarkMode) {
                    setDarkMode();
                    } else {
                    unsetDarkMode();
                    }
                 })
            }, 500);
        };
    </script>
</body>
</html>
